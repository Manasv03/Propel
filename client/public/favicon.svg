<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 64 64" role="img" aria-label="PROPEL favicon">
  <title>PROPEL</title>
  <rect width="100%" height="100%" fill="none"/>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0B74FF"/>
  <!-- Stylized P as rocket: body -->
  <path d="M30 18 H40 A4 4 0 0 1 44 22 V28 A10 10 0 0 1 34 38 H28 A2 2 0 0 1 26 36 V20 A2 2 0 0 1 28 18 Z" fill="#FFFFFF"/>
  <!-- Rocket flame / arrow tail to imply propulsion -->
  <path d="M18 40 C22 44, 28 46, 32 44 C36 42, 38 34, 30 32 C24 30, 20 34, 18 40 Z" fill="#FFB02E" opacity="0.95"/>
  <!-- Small window on rocket (P counter) -->
  <circle cx="36" cy="26" r="3" fill="#0B74FF"/>
  <!-- Optional subtle highlight -->
  <path d="M34 16 L44 16 L40 22" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
</svg>
